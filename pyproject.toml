[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "oxiform"
version = "0.0.1"
description = "Validate and (de)serialize Python types to JSON, YAML, TOML and MessagePack in one pass, with a Rust engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["validation", "serialization", "json", "yaml", "toml", "msgpack", "config"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/m4nd0r4s/oxiform"
Issues = "https://github.com/m4nd0r4s/oxiform/issues"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "pyright>=1.1.400", "ruff>=0.14"]
bench = ["msgspec>=0.19", "pydantic>=2.10", "orjson>=3.10"]

[tool.maturin]
manifest-path = "crates/oxiform-py/Cargo.toml"
python-source = "python"
module-name = "oxiform._oxiform"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python/oxiform", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["oxiform"]
