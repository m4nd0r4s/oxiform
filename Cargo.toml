[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/m4nd0r4s/oxiform"
# The crates are internal to the Python package (published to PyPI), not crates.io libraries.
publish = false

[workspace.dependencies]
oxiform-core = { path = "crates/oxiform-core" }
oxiform-formats = { path = "crates/oxiform-formats" }
pyo3 = "0.30"
# Strict standard base64, for bytes in text formats.
base64 = "0.22"
regex = "1"
# Shortest round-trip float text and fast integer text, for writers.
ryu = "1"
itoa = "1"
# Field lookup tables: fixed at compile time, so a fast non-keyed hash is safe.
rustc-hash = "2"
# Inline storage for the short stacks of every decode (path, open containers, fields).
smallvec = { version = "1", features = ["const_generics", "union"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
